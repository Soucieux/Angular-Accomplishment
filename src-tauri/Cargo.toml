[package]
name = "vision-canvas"
version = "0.0.0"
description = "Vision Canvas desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [ "devtools"] }
rust-embed = "8"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
