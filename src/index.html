<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Vision Canvas</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/x-icon" href="favicon.png?v=3" />
	</head>
	<body>
		<root></root>
		<script>
			if (localStorage.getItem('nav_collapsed') === 'true') {
				var drawer = document.querySelector('mat-drawer');
				if (drawer) {
					drawer.classList.add('nav-collapsed', 'nav-no-transition');
					var toggleIcon = drawer.querySelector('.nav-toggle-icon');
					if (toggleIcon) toggleIcon.textContent = 'menu';
				}
			}
		</script>
	</body>
</html>
