<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Vision Canvas</title>
		<base href="/" />

		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="manifest" href="manifest.webmanifest" />
		<link rel="apple-touch-icon" href="apple-touch-icon-180.png" />
		<link rel="icon" type="image/x-icon" href="favicon.png?v=3" />
	</head>
	<body>
		<root></root>
		<script>
			if (localStorage.getItem('nav_collapsed') === 'true') {
				var drawer = document.querySelector('mat-drawer');
				if (drawer) {
					drawer.classList.add('nav-collapsed', 'nav-no-transition');
					var toggleIcon = drawer.querySelector('.nav-toggle-icon');
					if (toggleIcon) toggleIcon.textContent = 'menu';
				}
			}
		</script>
	</body>
</html>
