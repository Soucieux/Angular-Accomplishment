<div class="graph-wrap">
	<svg #svg class="graph-svg" width="100%" height="100%">
		<g #pan>
			<g #edges></g>
			<g #nodes></g>
		</g>
	</svg>

	<div class="legend">
		<div class="legend-title">{{ VAULT_LEGEND_TITLE }}</div>
		<button
			type="button"
			class="legend-row"
			[class.is-active]="typeFilter === VAULT_NODE_ACCOUNT"
			[class.is-muted]="typeFilter && typeFilter !== VAULT_NODE_ACCOUNT"
			(click)="toggleFilterRow(VAULT_NODE_ACCOUNT)">
			<span class="legend-tile"></span>
			<span class="legend-label">{{ VAULT_TYPE_ACCOUNT }}</span>
			<span class="legend-count">{{ legendCounts.account }}</span>
		</button>
		<button
			type="button"
			class="legend-row"
			[class.is-active]="typeFilter === VAULT_NODE_EMAIL"
			[class.is-muted]="typeFilter && typeFilter !== VAULT_NODE_EMAIL"
			(click)="toggleFilterRow(VAULT_NODE_EMAIL)">
			<span class="legend-circle"></span>
			<span class="legend-label">{{ VAULT_TYPE_EMAIL }}</span>
			<span class="legend-count">{{ legendCounts.email }}</span>
		</button>
		<button
			type="button"
			class="legend-row"
			[class.is-active]="typeFilter === VAULT_NODE_PHONE"
			[class.is-muted]="typeFilter && typeFilter !== VAULT_NODE_PHONE"
			(click)="toggleFilterRow(VAULT_NODE_PHONE)">
			<span class="legend-diamond"></span>
			<span class="legend-label">{{ VAULT_TYPE_PHONE }}</span>
			<span class="legend-count">{{ legendCounts.phone }}</span>
		</button>
		<button
			type="button"
			class="legend-row legend-row-verified"
			[class.is-active]="typeFilter === VAULT_FILTER_KEY_VERIFIED"
			[class.is-muted]="typeFilter && typeFilter !== VAULT_FILTER_KEY_VERIFIED"
			(click)="toggleFilterRow(VAULT_FILTER_KEY_VERIFIED)">
			<span class="legend-verified"><span class="material-symbols-outlined">verified</span></span>
			<span class="legend-label">{{ VAULT_LEGEND_VERIFIED }}</span>
			<span class="legend-count">{{ legendCounts.verified }}</span>
		</button>
		<div class="legend-row legend-row-backup">
			<span class="legend-backup-swatch"><span class="legend-backup-arrow"></span></span>
			<span class="legend-label">{{ VAULT_LEGEND_BACKUP }}</span>
			<span class="legend-count">{{ legendCounts.backup }}</span>
		</div>
	</div>

	<div class="zoom-controls">
		<button type="button" class="zoom-button" (click)="zoomIn()">
			<span class="material-symbols-outlined">add</span>
		</button>
		<button type="button" class="zoom-button" (click)="zoomOut()">
			<span class="material-symbols-outlined">remove</span>
		</button>
		<button type="button" class="zoom-button" (click)="resetView()">
			<span class="material-symbols-outlined">recenter</span>
		</button>
	</div>
</div>
