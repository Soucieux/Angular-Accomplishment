<div class="scrim" [class.show]="gridOpen() || accountOpen()" (click)="closeAll()" aria-hidden="true"></div>

<div
	class="grid"
	[class.show]="gridOpen()"
	role="dialog"
	aria-modal="true"
	[attr.aria-label]="NAV_MOBILE_ALL_SECTIONS"
	[cdkTrapFocus]="gridOpen()"
	[cdkTrapFocusAutoCapture]="gridOpen()">
	<div class="grid-head">{{ NAV_MOBILE_ALL_SECTIONS }}</div>
	<div class="grid-cells" #gridCells>
		@for (navItem of secondary; track navItem.id) {
			<button
				class="cell"
				type="button"
				[class.on]="activeId === navItem.id"
				[attr.aria-current]="activeId === navItem.id ? 'page' : null"
				[attr.aria-label]="navItem.label"
				[attr.cdkFocusInitial]="activeId === navItem.id ? '' : null"
				(click)="pick(navItem.id)">
				<span class="cell-icon">
					<span
						class="material-symbols-outlined gradient-icon"
						[style.background-image]="navItem.gradient"
						style="font-size: 28px"
						[style.font-variation-settings]="
							activeId === navItem.id ? '\'FILL\' 1' : '\'FILL\' 0'
						"
						>{{ navItem.icon }}</span
					>
					@if (navItem.badge != null) {
						<span class="cell-badge">{{ navItem.badge }}</span>
					}
				</span>
				<span class="cell-label">{{ navItem.label }}</span>
			</button>
		}
	</div>
</div>

<div
	class="account-popover"
	[class.show]="accountOpen()"
	role="dialog"
	aria-modal="true"
	[attr.aria-label]="NAV_ARIA_ACCOUNT"
	[cdkTrapFocus]="accountOpen()"
	[cdkTrapFocusAutoCapture]="accountOpen()">
	@if (signedIn) {
		<div class="account-popover-header">
			<span class="account-popover-avatar" [style.background]="NAV_AVATAR_GRADIENT">{{ initial }}</span>
			<span class="account-popover-meta">
				<span class="account-popover-name">{{ userName }}</span>
				<span class="account-popover-status"
					><span class="account-popover-online-dot"></span>{{ LABEL_ONLINE }}</span
				>
			</span>
		</div>
		@if (notificationSupported) {
			<button
				class="account-popover-item"
				[class.account-popover-item--primary]="!notificationSubscribed()"
				type="button"
				(click)="toggleNotification()">
				<span class="material-symbols-outlined" style="font-size: 20px">{{
					notificationSubscribed() ? 'notifications_off' : 'notifications'
				}}</span>
				{{ notificationSubscribed() ? NAV_NOTIF_LABEL_DISABLE : NAV_NOTIF_LABEL_ENABLE }}
			</button>
		}
		<button class="account-popover-item" type="button" (click)="doNavigateToAccount()">
			<span class="material-symbols-outlined" style="font-size: 20px">manage_accounts</span
			><span>{{ ACCOUNT_TITLE_PAGE }}</span>
		</button>
		<button class="account-popover-item" type="button" (click)="doSwitchLocale()">
			<span class="material-symbols-outlined" style="font-size: 20px">language</span>
			{{ localeSwitchLabel }}
		</button>
		<button
			class="account-popover-item account-popover-item--danger"
			type="button"
			cdkFocusInitial
			(click)="doSignOut()">
			<span class="material-symbols-outlined" style="font-size: 20px">logout</span
			>{{ NAV_LABEL_SIGN_OUT }}
		</button>
	} @else {
		<div class="account-popover-header">
			<span class="account-popover-avatar account-popover-avatar--ghost">
				<span class="material-symbols-outlined" style="font-size: 24px">person</span>
			</span>
			<span class="account-popover-meta">
				<span class="account-popover-name">{{ NAV_MOBILE_WELCOME }}</span>
				<span class="account-popover-status">{{ NAV_MOBILE_OFFLINE }}</span>
			</span>
		</div>
		<button
			class="account-popover-item account-popover-item--primary"
			type="button"
			cdkFocusInitial
			(click)="doSignIn()">
			<span class="material-symbols-outlined" style="font-size: 20px">login</span
			>{{ NAV_LABEL_SIGN_IN }}
		</button>
	}
</div>

<div class="dock-wrap">
	<div class="dock" role="tablist" [attr.aria-label]="NAV_ARIA_PRIMARY">
		@for (navItem of primary; track navItem.id) {
			<button
				class="item"
				type="button"
				role="tab"
				[class.on]="activeId === navItem.id"
				[attr.aria-selected]="activeId === navItem.id"
				[attr.aria-label]="navItem.label"
				[style.background]="
					activeId === navItem.id ? navItem.gradient || 'var(--vc-rose)' : 'transparent'
				"
				[style.box-shadow]="activeId === navItem.id ? '0 4px 14px rgba(0,0,0,0.22)' : 'none'"
				(click)="select(navItem.id)">
				<span class="icon-wrap">
					@if (activeId === navItem.id) {
						<span
							class="material-symbols-outlined"
							style="color: #fff; font-size: 25px; font-variation-settings: 'FILL' 1"
							>{{ navItem.icon }}</span
						>
					} @else {
						<span
							class="material-symbols-outlined gradient-icon"
							[style.background-image]="navItem.gradient"
							style="font-size: 25px"
							>{{ navItem.icon }}</span
						>
					}
					@if (navItem.badge != null && activeId !== navItem.id) {
						<span class="dot"></span>
					}
				</span>
			</button>
		}
		<button
			class="grid-button"
			type="button"
			[class.open]="gridOpen()"
			aria-haspopup="dialog"
			[attr.aria-expanded]="gridOpen()"
			[attr.aria-label]="gridOpen() ? NAV_ARIA_CLOSE_SECTIONS : NAV_ARIA_SHOW_SECTIONS"
			(click)="toggleGrid()">
			<span class="material-symbols-outlined" style="color: var(--vc-rose); font-size: 25px">{{
				gridOpen() ? 'close' : 'grid_view'
			}}</span>
		</button>

		<span class="dock-divider" aria-hidden="true"></span>

		<button
			class="account-button"
			type="button"
			[class.open]="accountOpen()"
			aria-haspopup="dialog"
			[attr.aria-expanded]="accountOpen()"
			[attr.aria-label]="signedIn ? NAV_ARIA_ACCOUNT_PREFIX + userName : NAV_LABEL_SIGN_IN"
			(click)="toggleAccount()">
			@if (signedIn) {
				<span class="avatar" [style.background]="NAV_AVATAR_GRADIENT"
					>{{ initial }}<span class="presence"></span
				></span>
			} @else {
				<span
					class="material-symbols-outlined gradient-icon"
					style="background-image: linear-gradient(135deg, #8e54e9, #e91e8c); font-size: 25px"
					>person</span
				>
			}
		</button>
	</div>
</div>
