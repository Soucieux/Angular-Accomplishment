<p-dialog
	[(visible)]="visible"
	[modal]="true"
	appendTo="body"
	[resizable]="false"
	[closable]="false"
	(onHide)="onDialogClosed()"
	styleClass="category-dialog">
	<ng-template #header>
		<span class="category-dialog-title">{{
			isEditMode ? editTitle : PORTAL_CATEGORY_DIALOG_TITLE_ADD
		}}</span>
	</ng-template>

	<div class="category-dialog-field">
		<span class="category-dialog-label">{{ LABEL_NAME }}</span>
		<input
			type="text"
			[(ngModel)]="name"
			[placeholder]="PORTAL_CATEGORY_DIALOG_PLACEHOLDER_NAME"
			(keyup.enter)="onSubmit()"
			autocomplete="off" />
	</div>

	<ng-template #footer>
		@if (isEditMode && deleteCallback) {
			<button class="category-dialog-button-delete" (click)="onDeleteRequested()">
				{{ DIALOG_BTN_DELETE }}
			</button>
		}
		<button class="category-dialog-button-ghost" (click)="onDialogClosed()">
			{{ DIALOG_BTN_CANCEL }}
		</button>
		<button class="category-dialog-button-gradient" [disabled]="!isValid" (click)="onSubmit()">
			{{ DIALOG_BTN_SAVE }}
		</button>
	</ng-template>
</p-dialog>
