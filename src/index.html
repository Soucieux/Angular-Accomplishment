<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Vision Canvas</title>
		<base href="/" />

		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="manifest" href="assets/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="apple.png" />
		<link rel="icon" type="image/png" id="favicon" href="favicon.png" />
		<script>
			(function () {
				var favicon = document.getElementById('favicon');
				var query = window.matchMedia('(prefers-color-scheme: dark)');
				function applyTheme(dark) {
					favicon.href = dark ? 'favicon-dark.png' : 'favicon.png';
				}
				applyTheme(query.matches);
				query.addEventListener('change', function (e) { applyTheme(e.matches); });
			})();
		</script>
	</head>
	<body>
		<root></root>
	</body>
</html>
