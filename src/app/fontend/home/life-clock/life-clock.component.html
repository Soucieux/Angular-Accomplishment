<div class="clock-display">{{ clockTime }}</div>
<div class="clock-date-str">{{ clockDate }}</div>

<!-- Year -->
<div class="year-progress-block">
	<div class="year-progress-header">
		<span class="year-label-text">{{ currentYear }} Progress</span>
		<span class="year-pct">{{ yearProgress }}%</span>
	</div>
	<div class="year-bar-track">
		<div class="year-bar-fill" [style.width.%]="yearProgress"></div>
	</div>
	<div class="year-days-label">Day {{ dayOfYear }} of {{ daysInYear }}</div>
</div>

<!-- Month -->
<div class="mini-progress-block">
	<div class="mini-progress-header">
		<span class="mini-label">This Month</span>
		<span class="mini-pct mini-pct-month">{{ monthProgress }}%</span>
	</div>
	<div class="mini-bar-track">
		<div class="mini-bar-fill mini-bar-month" [style.width.%]="monthProgress"></div>
	</div>
	<div class="mini-sub-label">Day {{ currentDayOfMonth }} of {{ daysInMonth }}</div>
</div>

<!-- Week -->
<div class="mini-progress-block">
	<div class="mini-progress-header">
		<span class="mini-label">This Week</span>
		<span class="mini-pct mini-pct-week">{{ weekProgress }}%</span>
	</div>
	<div class="mini-bar-track">
		<div class="mini-bar-fill mini-bar-week" [style.width.%]="weekProgress"></div>
	</div>
	<div class="mini-sub-label">Day {{ dayOfWeekNum }} of 7</div>
</div>

<!-- Day -->
<div class="mini-progress-block">
	<div class="mini-progress-header">
		<span class="mini-label">Today</span>
		<span class="mini-pct mini-pct-day">{{ dayProgress }}%</span>
	</div>
	<div class="mini-bar-track">
		<div class="mini-bar-fill mini-bar-day" [style.width.%]="dayProgress"></div>
	</div>
</div>
